name: CI

on:
    pull_request:
    push:
        branches: [main]

jobs:
    check:
        # Windows and macOS are supported by the code — `prepare-bin.mjs` and
        # `package-smoke.mjs` both branch on `win32` — and were never exercised,
        # so the branches were untested by construction. The suite takes ~15 s,
        # so the matrix is close to free.
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, macos-latest, windows-latest]
                node: [22, 24]
        steps:
            - uses: actions/checkout@v7
            # Version comes from the packageManager field in package.json.
            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v7
              with:
                  node-version: ${{ matrix.node }}
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            # Full gate: clean build (core + UI), API/UI typechecks and tests.
            - run: pnpm run check
            # Generated artifacts that are committed must match what the build
            # produces. `check` rebuilds the Claude plugin before the test that
            # compares it, so that test can only ever compare fresh output
            # against fresh output — a stale committed plugin shipped a hook
            # two commits behind its own source and nothing noticed.
            - name: Committed build output is current
              # bash explicitly: a `run:` block defaults to PowerShell on the
              # Windows runners, where `|| { ... }` and `>&2` are parse errors.
              shell: bash
              run: |
                  node ./scripts/build-plugin.ts
                  if ! git diff --exit-code; then
                      echo "::error::committed build output is stale; run the build and commit the result"
                      exit 1
                  fi
            # The hosted demo build must keep compiling too.
            - run: pnpm run build:demo

    audit:
        # `pnpm audit` ran only inside `check:release`, which runs on a tag push
        # — so an advisory published by the ecosystem failed a *release* instead
        # of a pull request. That is what it cost for v0.5.4: a tag whose
        # release did nothing, `Publish to npm` never reached, and the tag moved
        # onto the fix rather than the version being burned. The advisory did not
        # change; only where it surfaced did. Here a re-run replaces a retag.
        #
        # Blocking, and at the same threshold as the release gate. A warning
        # nobody has to act on is not a gate, and the repository already fixes
        # these one way — a `pnpm.overrides` entry — which is a reviewable diff.
        # Read what that fix does and does not do in ADR-0021 before adding one.
        #
        # `moderate`, not `high`, and the reason is GitHub rather than severity:
        # Dependabot alerts on moderate, so a gate that started at `high` left
        # every moderate advisory to accumulate in the security tab where nobody
        # is obliged to look and nothing turns red. That is what the `hono` ReDoS
        # did for days. Aligning the floor with the alerting cost nothing at the
        # time — both trees audit clean at `low` — and the point is that the next
        # one fails a pull request instead of waiting to be noticed.
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm audit --audit-level=moderate
            # And the tree a consumer actually resolves, which the line above
            # cannot see: root `pnpm.overrides` rewrite resolution in this
            # workspace only, so an override silences the gate here and reaches
            # no user. Blocking with no allowlist, deliberately — ADR-0021.
            - run: pnpm run audit:consumer

    smoke:
        # Packs the real tarball and installs it in a clean consumer. Only worth
        # running once: it is the slowest job and platform-independent.
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm run build
            - run: pnpm run smoke:package

    codeql:
        # The package holds unauthenticated read and write access to a
        # repository when `workfile ui` runs, so a static pass is worth its
        # minutes.
        runs-on: ubuntu-latest
        permissions:
            security-events: write
            actions: read
            contents: read
        steps:
            - uses: actions/checkout@v7
            - uses: github/codeql-action/init@v4.37.3
              with:
                  languages: javascript-typescript
                  config-file: ./.github/codeql/codeql-config.yml
            - uses: github/codeql-action/analyze@v4.37.3
