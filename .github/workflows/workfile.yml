name: Workfile

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  doctor:
    # Not the generated `npx @illodev/workfile` template: inside this
    # repository that spec matches the checkout's own package.json, so npx
    # resolves to the local, unbuilt project and the bin does not exist.
    # Validating the protocol with the tree's own code is also the honest
    # dogfood: a PR is checked by the exact behavior it ships.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:core
      - name: Validate repository protocol
        run: node ./dist/bin/workfile.js doctor --json
      - name: Check generated agent instructions
        run: node ./dist/bin/workfile.js agents check --json
