name: Release

on:
    push:
        tags: ["v*"]

permissions:
    contents: read
    # OIDC token for npm trusted publishing — no stored npm token needed.
    id-token: write

jobs:
    publish:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            # Version comes from the packageManager field in package.json.
            - uses: pnpm/action-setup@v6
            # No registry-url here: it would write an _authToken line into
            # .npmrc, and any configured token makes the npm CLI skip the
            # OIDC exchange that trusted publishing requires.
            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: pnpm
            # Publishing uses the npm CLI (trusted publishing requires
            # npm >= 11.5; Node 22 bundles 10.x).
            - run: npm install -g npm@latest
            - run: pnpm install --frozen-lockfile
            - name: Verify tag matches package version
              run: |
                  TAG="${GITHUB_REF_NAME#v}"
                  VERSION="$(node -p "require('./package.json').version")"
                  if [ "$TAG" != "$VERSION" ]; then
                      echo "Tag v$TAG does not match package version $VERSION" >&2
                      exit 1
                  fi
                  # Workspace packages ride the same version, always.
                  node ./scripts/sync-workspace-versions.ts --check
            # Build + typechecks + tests + audit + packaged-tarball smoke.
            - run: pnpm run check:release
            - name: Publish to npm
              run: |
                  VERSION="$(node -p "require('./package.json').version")"
                  # There is no prerelease channel. A `next` dist-tag was set
                  # once during the 0.1.0 bootstrap and sat on that release
                  # candidate for twelve releases, because publishing is the
                  # only registry write this job can make: OIDC authorizes
                  # `npm publish` and nothing else, so nothing here could ever
                  # move the tag off it (npm/cli#8547). A channel that cannot
                  # be advanced is worse than no channel, so it was removed.
                  #
                  # This refuses rather than falls through, because falling
                  # through would publish a release candidate to `latest` —
                  # the one outcome worse than the tag this replaced.
                  case "$VERSION" in
                      *-*)
                          echo "Refusing to publish prerelease $VERSION: this project has no prerelease channel." >&2
                          exit 1
                          ;;
                  esac
                  # The root is a private workspace shell; everything
                  # publishable lives under packages/, in version lockstep.
                  # Each needs this repo registered as its trusted publisher.
                  for package in packages/*/; do
                      (cd "$package" && npm publish --tag latest)
                  done
