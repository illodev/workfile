name: Release

on:
    push:
        tags: ["v*"]

permissions:
    contents: read
    # OIDC token for npm trusted publishing — no stored npm token needed.
    id-token: write

jobs:
    publish:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            # Version comes from the packageManager field in package.json.
            - uses: pnpm/action-setup@v6
            # No registry-url here: it would write an _authToken line into
            # .npmrc, and any configured token makes the npm CLI skip the
            # OIDC exchange that trusted publishing requires.
            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: pnpm
            # Publishing uses the npm CLI (trusted publishing requires
            # npm >= 11.5; Node 22 bundles 10.x).
            - run: npm install -g npm@latest
            - run: pnpm install --frozen-lockfile
            - name: Verify tag matches package version
              run: |
                  TAG="${GITHUB_REF_NAME#v}"
                  VERSION="$(node -p "require('./package.json').version")"
                  if [ "$TAG" != "$VERSION" ]; then
                      echo "Tag v$TAG does not match package version $VERSION" >&2
                      exit 1
                  fi
                  # Workspace packages ride the same version, always.
                  node ./scripts/sync-workspace-versions.ts --check
            # Build + typechecks + tests + audit + packaged-tarball smoke.
            - run: pnpm run check:release
            - name: Publish to npm
              run: |
                  VERSION="$(node -p "require('./package.json').version")"
                  # There is no prerelease channel. A `next` dist-tag was set
                  # once during the 0.1.0 bootstrap and sat on that release
                  # candidate for twelve releases, because publishing is the
                  # only registry write this job can make: OIDC authorizes
                  # `npm publish` and nothing else, so nothing here could ever
                  # move the tag off it (npm/cli#8547). A channel that cannot
                  # be advanced is worse than no channel, so it was removed.
                  #
                  # This refuses rather than falls through, because falling
                  # through would publish a release candidate to `latest` —
                  # the one outcome worse than the tag this replaced.
                  case "$VERSION" in
                      *-*)
                          echo "Refusing to publish prerelease $VERSION: this project has no prerelease channel." >&2
                          exit 1
                          ;;
                  esac
                  # The root is a private workspace shell; everything
                  # publishable lives under packages/, in version lockstep.
                  # Each needs this repo registered as its trusted publisher.
                  for package in packages/*/; do
                      (cd "$package" && npm publish --tag latest)
                  done
            # The MCP Registry stores metadata, never artifacts, and validates
            # it against the package it points at: `mcpName` in the published
            # package.json has to match `name` in server.json, and the version
            # has to be one npm already serves. Both make this a step after the
            # publish loop rather than beside it.
            - name: Install mcp-publisher
              run: |
                  curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
            - name: Publish to the MCP Registry
              run: |
                  # `github-oidc` reuses the id-token permission trusted
                  # publishing already requires, so the registry write adds no
                  # stored credential. That is why the server is named under
                  # io.github.illodev/ and not a com.illodev/ namespace: the
                  # nicer string is only reachable with an Ed25519 private key
                  # in repository secrets, and this workflow was built to hold
                  # none.
                  ./mcp-publisher login github-oidc
                  ./mcp-publisher publish

    # Its own job for the permission, not for the ordering. Creating a release
    # needs `contents: write`, and a job's `permissions` block replaces the
    # workflow's rather than adding to it — so keeping this separate is what
    # stops the write scope from covering the steps that install dependencies
    # and execute the suite.
    #
    # `needs` then gives the ordering the registry step already argued for:
    # npm and the MCP Registry are irreversible, this is not. A failure here
    # leaves both published and the note missing, which is the recoverable
    # direction.
    release:
        needs: publish
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: 22
            - name: Publish the GitHub Release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  # The body is the version's section of CHANGELOG.md, which
                  # `changelog release` rendered from the fragments. Nothing is
                  # written twice, so nothing can drift; and the script exits
                  # non-zero rather than emitting an empty body, so a tag cut
                  # before the changelog was released fails here instead of
                  # publishing a release that says nothing.
                  VERSION="${GITHUB_REF_NAME#v}"
                  node ./scripts/release-notes.ts "$VERSION" > release-notes.md
                  gh release create "$GITHUB_REF_NAME" \
                      --title "$GITHUB_REF_NAME" \
                      --notes-file release-notes.md
