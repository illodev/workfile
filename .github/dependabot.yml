version: 2
updates:
    # The root holds only workspace tooling; the published packages declare
    # @types/node and @huggingface/transformers — everything else is a
    # devDependency, so an update can break the build but never a consumer.
    - package-ecosystem: npm
      directories: ["/", "/packages/*"]
      schedule:
          interval: monthly
      groups:
          dev:
              patterns: ["*"]
    - package-ecosystem: github-actions
      directory: "/"
      schedule:
          interval: monthly
